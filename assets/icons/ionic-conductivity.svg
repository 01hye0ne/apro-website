  <path d="M4.5 16A10 10 0 0 0 22 20.5"/><path d="M24 24v-5h-5"/>
  </svg></span>
  <span class="k">전체 수명 연장</span>
  <span class="en">Cycle Life</span>
  </li>
  <li>
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
