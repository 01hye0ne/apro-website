  <!-- v3.1(gray-v3.1, d7d00ba)의 'PICKLE Station' 카드를 그대로 되살린 것.
  그 시절엔 이 소분류에 카드가 하나뿐이라 충전 솔루션 전체를 한 장이 다뤘고,
  v4.0 에서 급속 / 완속으로 갈리면서 그 자리를 급속 충전기가 받는다.
  제목만 새 체계의 이름을 쓰고(같은 브랜드인 완속 카드와 겹치면 안 된다)
  줄글·키워드·사진은 원문 그대로다 — 제품명 PICKLE Station 은 줄글 첫 줄에 있다 -->
  <article class="hcard" data-tab="급속 충전기">
  <div class="hleft">
  <h3>급속 충전기</h3>
  <div class="hlead">
  <p>에이프로의 전기자동차 충전 솔루션 PICKLE Station은 주거용 충전부터 공공 충전소와 상용 플릿까지 다양한 운영 환경에 대응하는 안정적인 충전 인프라입니다.</p>
  <!-- 원문 둘째 단락 첫 문장이 "하드웨어 / 전력변환·제어 / 통신 / 인증·안전관리" 네 항목을
  그대로 나열하고 있어 아래 픽토그램으로 접었다. 뒷문장(원격 운영·EMS 연계)은 남겼다 -->
  <p>원격 모니터링과 충전기 운영·유지관리 기능을 지원하며, 충전 운영 플랫폼 및 에너지관리시스템과 연계하여 충전 인프라를 효율적으로 관리하고 유연하게 확장할 수 있습니다.</p>
  <p>에이프로가 축적해 온 전력전자와 배터리 시스템 기술을 기반으로 안전하고 지속 가능한 전기 모빌리티 충전 생태계를 구축합니다.</p>
  </div>
