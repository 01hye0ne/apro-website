  </svg></span>
  <span class="k">설비 제어</span>
  <span class="txt">충방전기, 디개싱(Degassing), 에이징 룸 등 활성화 공정 내 개별 물류 및 제조 설비의 하드웨어를 실시간으로 직접 제어합니다.</span>
  </div>
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 24V14M12 24V8M20 24v-7"/><path d="M2 24h24"/>
  </svg></span>
  <span class="k">데이터 수집</span>
  <span class="txt">센서로부터 온도, 압력, 전압, 전류 등 공정 중 발생하는 실시간 물리적 데이터를 정밀하게 측정하고 감지합니다.</span>
  </div>
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M14 4l9 4v6c0 6-4 9-9 11-5-2-9-5-9-11V8z"/><path d="M10 14l2.5 2.5L18 11"/>
  </svg></span>
  <span class="k">안전 인터록</span>
  <span class="txt">가스 누출, 과전압, 이상 고온 등 위험 상황이 감지되면 설비를 즉시 정지시키는 비상 인터록 시스템을 작동합니다.</span>
  </div>
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M11 18H8a5 5 0 0 1 0-10h3"/><path d="M17 8h3a5 5 0 0 1 0 10h-3"/><path d="M9 13h10"/>
  </svg></span>
  <span class="k">상위 연동</span>
  <span class="txt">상위 제어 시스템인 PC나 MES와 통신하며 수집한 공정 데이터를 전송하고, 하향된 공정 레시피 명령을 받아 수행합니다.</span>
  </div>
  </div>
  </div>
  </article>
  <article class="hcard" data-tab="MES">
  <div class="hleft">
  <h3>MES(Manufacturing Execution System)</h3>
  </div>
  <div class="hright">
  <div class="descgrid" role="img" aria-label="MES 기능 4종">
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="7" width="20" height="15" rx="1.5"/><path d="M8 7v15M12 7v15M16 7v15M20 7v15"/>
  </svg></span>
  <span class="k">생산 추적</span>
  <span class="txt">배터리 셀의 바코드를 스캔하여 활성화 공정의 시작부터 끝까지 전 제조 이력을 실시간으로 추적 및 관리합니다.</span>
  </div>
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8 3h8l6 6v16H8z"/><path d="M16 3v6h6"/><path d="M14 13v8M10.5 18l3.5 3.5 3.5-3.5"/>
  </svg></span>
  <span class="k">레시피 하향</span>
  <span class="txt">배터리 모델별로 정해진 충방전 조건, 에이징 시간 등의 세부 공정 레시피를 각 설비(PLC)에 자동으로 전달합니다.</span>
  </div>
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="14" cy="11" r="7"/><path d="M11 11l2 2 4-4"/><path d="M10 17.5l-2 6.5 6-3 6 3-2-6.5"/>
  </svg></span>
  <span class="k">품질 판정</span>
  <span class="txt">충방전 결과 데이터(용량, 저항 등)를 분석하여 해당 배터리 셀의 합격/불합격(Pass/Fail) 및 등급(Grading)을 판정합니다.</span>
  </div>
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 8v4a3 3 0 0 0 3 3h4"/><path d="M23 8v4a3 3 0 0 1-3 3h-4"/><path d="M14 15v8"/><circle cx="5" cy="6" r="2.2"/><circle cx="23" cy="6" r="2.2"/><circle cx="14" cy="17.5" r="2.2"/>
  </svg></span>
  <span class="k">데이터 통합</span>
  <span class="txt">전체 공정의 생산량, 설비 가동률, 불량률 등의 통계 데이터를 시각화하여 공장 전반의 생산 효율성을 최적화합니다.</span>
  </div>
  </div>
  </div>
  </article>
  </div>
  </section>
  <!-- 04 -->
  <section class="hsec" id="s4">
  <div class="hrail"></div>
  <div class="htrack">
  <article class="hcard" data-tab="탄소나노튜브">
  <div class="hleft">
  <h3>탄소나노튜브</h3>
  <div class="hlead">
  <p>고성능 단일벽(SW) 및 소수벽(FW) 탄소나노튜브의 견고한 전도성 네트워크가 활물질 간의 전자 이동을 극대화합니다.</p>
  <p>배터리 내부 저항을 효과적으로 낮추어 전체 수명을 연장하고 충전 시간을 크게 단축합니다. 실리콘 음극재 도입 시 발생하는 고질적인 부피 팽창과 입자 붕괴 현상을 구조적으로 단단하게 억제합니다.</p>
  </div>
  <ul class="pict">
  <li>
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="3 8 11 16 16 11 25 20"/>
  <polyline points="25 14 25 20 19 20"/>
  </svg></span>
  <span class="k">내부 저항 저감</span>
  <span class="en">Low Resistance</span>
  </li>
  <li>
