  <article class="hcard" data-tab="LiFSI 전해염">
  <div class="hleft">
  <h3>LiFSI 전해염</h3>
  <div class="hlead">
  <p>기존 LiPF6 대비 탁월한 이온 이동 속도를 구현하여 배터리 내부의 이온 전도도를 크게 향상시킵니다. 고온 및 고전압의 거친 구동 환경에서도 전해액의 열분해를 막고 변함없는 화학적 안정성을 발휘합니다.</p>
  <p>에이프로 머티리얼즈의 핵심 소재 기술력으로 완성된 전해염이 고성능 배터리의 안전성과 효율을 동시에 보장합니다.</p>
  </div>
  <ul class="pict">
  <li>
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 8.5h22"/><path d="M3 19.5h22"/>
  <path d="M6 14h11"/><path d="M14 10.5l3.5 3.5-3.5 3.5"/>
</svg>
