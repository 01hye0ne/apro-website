  <article class="hcard" data-tab="PLC">
  <div class="hleft">
  <h3>PLC(Programmable Logic Controller)</h3>
  </div>
  <div class="hright">
  <div class="descgrid" role="img" aria-label="PLC 기능 4종">
  <div class="descitem">
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
